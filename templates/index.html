<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canada Labour Market Tracker</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --notion-bg: #191919;
            --notion-card: #202020;
            --notion-border: rgba(255, 255, 255, 0.08);
            --notion-text: #ffffff;
            --notion-text-muted: #9b9a97;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--notion-bg);
            color: var(--notion-text);
            margin: 0;
            padding: 24px 20px;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid var(--notion-border);
            padding-bottom: 14px;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 4px 0;
        }

        .subtitle {
            color: var(--notion-text-muted);
            font-size: 12px;
            margin: 0;
        }

        .release-info {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--notion-text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            border: 1px solid var(--notion-border);
            text-align: right;
            line-height: 1.4;
        }

        .release-info span {
            color: var(--notion-text);
            font-weight: 500;
        }

        .dashboard-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--notion-card);
            border: 1px solid var(--notion-border);
            border-radius: 8px;
            padding: 16px 20px 12px 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 2px 0;
            color: #f3f3f3;
        }

        .card-desc {
            color: var(--notion-text-muted);
            font-size: 11px;
            margin: 0;
        }

        .chart-container {
            position: relative;
            height: 200px;
            width: 100%;
        }

        .loading {
            text-align: center;
            color: var(--notion-text-muted);
            padding: 40px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div>
            <h1>Canada Labour Market Tracker</h1>
            <p class="subtitle">Statistics Canada Table 14-10-0287-01 (Seasonally Adjusted)</p>
        </div>
        <div class="release-info" id="releaseTracker">
            Latest Release: <span id="latestReleaseText">Loading...</span><br>
            Upcoming Release: <span id="upcomingReleaseText">Loading...</span>
        </div>
    </div>

    <div class="dashboard-grid" id="dashboard">
        <div class="loading">Loading macroeconomic data...</div>
    </div>

    <script>
        // Automatically calculate Statistics Canada LFS release schedule
        // StatCan LFS is typically released on the second Friday of each month.
        function updateReleaseSchedule() {
            const now = new Date();
            let year = now.getFullYear();
            let month = now.getMonth(); // 0-indexed

            function getSecondFriday(y, m) {
                let d = new Date(y, m, 1);
                let count = 0;
                while (d.getMonth() === m) {
                    if (d.getDay() === 5) { // Friday
                        count++;
                        if (count === 2) return d;
                    }
                    d.setDate(d.getDate() + 1);
                }
                return null;
            }

            let currentMonthSecondFriday = getSecondFriday(year, month);
            
            let latest, upcoming;
            if (now >= currentMonthSecondFriday) {
                latest = currentMonthSecondFriday;
                // Next is second Friday of next month
                let nextMonth = month + 1;
                let nextYear = year;
                if (nextMonth > 11) { nextMonth = 0; nextYear++; }
                upcoming = getSecondFriday(nextYear, nextMonth);
            } else {
                upcoming = currentMonthSecondFriday;
                // Previous month's second Friday
                let prevMonth = month - 1;
                let prevYear = year;
                if (prevMonth < 0) { prevMonth = 11; prevYear--; }
                latest = getSecondFriday(prevYear, prevMonth);
            }

            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('latestReleaseText').innerText = latest.toLocaleDateString('en-CA', options);
            document.getElementById('upcomingReleaseText').innerText = upcoming.toLocaleDateString('en-CA', options);
        }

        updateReleaseSchedule();

        async function loadDashboardData() {
            try {
                const response = await fetch('/api/labor-data');
                const data = await response.json();

                if (data.error) {
                    document.getElementById('dashboard').innerHTML = `<div class="loading" style="color: #ff6b6b;">Error: ${data.error}</div>`;
                    return;
                }

                const grid = document.getElementById('dashboard');
                grid.innerHTML = `
                    <div class="card">
                        <div class="card-header-row">
                            <div>
                                <h3 class="card-title">Unemployment Rate (%)</h3>
                                <p class="card-desc">Share of labor force without work</p>
                            </div>
                        </div>
                        <div class="chart-container">
                            <canvas id="unemploymentChart"></canvas>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header-row">
                            <div>
                                <h3 class="card-title">Participation Rate (%)</h3>
                                <p class="card-desc">Active working-age population share</p>
                            </div>
                        </div>
                        <div class="chart-container">
                            <canvas id="participationChart"></canvas>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header-row">
                            <div>
                                <h3 class="card-title">Employment Rate (%)</h3>
                                <p class="card-desc">Employed share of total population (15+)</p>
                            </div>
                        </div>
                        <div class="chart-container">
                            <canvas id="employmentChart"></canvas>
                        </div>
                    </div>
                `;

                function getAxisBounds(values) {
                    const min = Math.min(...values);
                    const max = Math.max(...values);
                    const padding = (max - min) * 0.5 || 0.5;
                    return {
                        min: Math.floor((min - padding) * 10) / 10,
                        max: Math.ceil((max + padding) * 10) / 10
                    };
                }

                function createMixedChart(canvasId, values, barColorHex, barRgba) {
                    const bounds = getAxisBounds(values);

                    const valueLabelPlugin = {
                        id: `valueLabel_${canvasId}`,
                        afterDatasetsDraw(chart) {
                            const { ctx, data } = chart;
                            ctx.save();
                            ctx.font = 'bold 9px sans-serif';
                            ctx.fillStyle = '#ffffff';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'bottom';

                            const metaBars = chart.getDatasetMeta(0);
                            metaBars.data.forEach((bar, index) => {
                                const val = data.datasets[0].data[index];
                                if (val !== null && val !== undefined) {
                                    ctx.fillText(val.toFixed(1) + '%', bar.x, bar.y - 3);
                                }
                            });
                            ctx.restore();
                        }
                    };

                    return new Chart(document.getElementById(canvasId), {
                        type: 'bar',
                        data: {
                            labels: data.months,
                            datasets: [
                                {
                                    type: 'bar',
                                    label: 'Monthly',
                                    data: values,
                                    backgroundColor: barRgba,
                                    borderColor: barColorHex,
                                    borderWidth: 0,
                                    borderRadius: 2,
                                    barPercentage: 0.82,
                                    categoryPercentage: 0.92,
                                    order: 2
                                },
                                {
                                    type: 'line',
                                    label: 'Trend',
                                    data: values,
                                    borderColor: '#f1c40f',
                                    backgroundColor: 'transparent',
                                    borderWidth: 2,
                                    pointRadius: 2,
                                    pointHoverRadius: 5,
                                    pointBackgroundColor: '#f1c40f',
                                    tension: 0.3,
                                    order: 1
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: {
                                mode: 'index',
                                intersect: false,
                            },
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    backgroundColor: 'rgba(24, 24, 24, 0.95)',
                                    titleFont: { size: 11 },
                                    bodyFont: { size: 12, weight: '600' },
                                    padding: 8,
                                    borderColor: 'rgba(255, 255, 255, 0.15)',
                                    borderWidth: 1,
                                    cornerRadius: 4,
                                    callbacks: {
                                        label: function(context) {
                                            let label = context.dataset.label || '';
                                            if (label) {
                                                label += ': ';
                                            }
                                            if (context.parsed.y !== null) {
                                                label += context.parsed.y.toFixed(1) + '%';
                                            }
                                            return label;
                                        }
                                    }
                                }
                            },
                            scales: {
                                x: {
                                    grid: { display: false },
                                    ticks: { color: '#8b8a87', font: { size: 9 }, maxTicksLimit: 14 }
                                },
                                y: {
                                    min: bounds.min,
                                    max: bounds.max,
                                    grid: { color: 'rgba(255, 255, 255, 0.03)', drawBorder: false },
                                    ticks: { color: '#8b8a87', font: { size: 9 }, padding: 4 }
                                }
                            }
                        },
                        plugins: [valueLabelPlugin]
                    });
                }

                createMixedChart('unemploymentChart', data.unemployment_rate, '#4da6ff', 'rgba(77, 166, 255, 0.75)');
                createMixedChart('participationChart', data.participation_rate, '#2ecc71', 'rgba(46, 204, 113, 0.75)');
                createMixedChart('employmentChart', data.employment_rate, '#f1c40f', 'rgba(241, 196, 15, 0.75)');

            } catch (err) {
                console.error("Failed to load chart data:", err);
                document.getElementById('dashboard').innerHTML = `<div class="loading" style="color: #ff6b6b;">Failed to connect to backend API.</div>`;
            }
        }

        loadDashboardData();
    </script>
</body>
</html>
