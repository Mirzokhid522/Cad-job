<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canada Labour Market Tracker</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --notion-bg: #191919;
            --notion-card: #202020;
            --notion-border: rgba(255, 255, 255, 0.08);
            --notion-text: #ffffff;
            --notion-text-muted: #9b9a97;
            --accent-green: #2ecc71;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--notion-bg);
            color: var(--notion-text);
            margin: 0;
            padding: 40px 24px;
        }

        .header-container {
            max-width: 1480px;
            margin: 0 auto 35px auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid var(--notion-border);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 26px;
            font-weight: 600;
            margin: 0 0 6px 0;
        }

        .subtitle {
            color: var(--notion-text-muted);
            font-size: 13px;
            margin: 0;
        }

        .status-badge {
            background-color: rgba(46, 204, 113, 0.12);
            color: var(--accent-green);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid rgba(46, 204, 113, 0.25);
        }

        .dashboard-grid {
            max-width: 1480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 36px;
        }

        .card {
            background-color: var(--notion-card);
            border: 1px solid var(--notion-border);
            border-radius: 8px;
            padding: 24px 24px 20px 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 17px;
            font-weight: 600;
            margin: 0 0 2px 0;
            color: #f3f3f3;
        }

        .card-desc {
            color: var(--notion-text-muted);
            font-size: 12px;
            margin: 0;
        }

        .card-action-btn {
            background: #528bff;
            border: none;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .chart-container {
            position: relative;
            height: 440px;
            width: 100%;
        }

        .loading {
            text-align: center;
            color: var(--notion-text-muted);
            padding: 80px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div>
            <h1>Canada Labour Market Tracker</h1>
            <p class="subtitle">Live Feed: Statistics Canada Table 14-10-0287-01 (Seasonally Adjusted)</p>
        </div>
        <div class="status-badge">● Live API Synced</div>
    </div>

    <div class="dashboard-grid" id="dashboard">
        <div class="loading">Loading live macroeconomic data...</div>
    </div>

    <script>
        async function loadDashboardData() {
            try {
                const response = await fetch('/api/labor-data');
                const data = await response.json();

                if (data.error) {
                    document.getElementById('dashboard').innerHTML = `<div class="loading" style="color: #ff6b6b;">Error: ${data.error}</div>`;
                    return;
                }

                const grid = document.getElementById('dashboard');
                grid.innerHTML = `
                    <div class="card">
                        <div class="card-header-row">
                            <div>
                                <h3 class="card-title">Unemployment Rate (%)</h3>
                                <p class="card-desc">Share of labor force without work</p>
                            </div>
                            <button class="card-action-btn">−</button>
                        </div>
                        <div class="chart-container">
                            <canvas id="unemploymentChart"></canvas>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header-row">
                            <div>
                                <h3 class="card-title">Participation Rate (%)</h3>
                                <p class="card-desc">Active working-age population share</p>
                            </div>
                            <button class="card-action-btn">−</button>
                        </div>
                        <div class="chart-container">
                            <canvas id="participationChart"></canvas>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header-row">
                            <div>
                                <h3 class="card-title">Employment Rate (%)</h3>
                                <p class="card-desc">Employed share of total population (15+)</p>
                            </div>
                            <button class="card-action-btn">−</button>
                        </div>
                        <div class="chart-container">
                            <canvas id="employmentChart"></canvas>
                        </div>
                    </div>
                `;

                // Helper to compute dynamic bounds so small shifts are heavily exaggerated and clear
                function getAxisBounds(values) {
                    const min = Math.min(...values);
                    const max = Math.max(...values);
                    const padding = (max - min) * 0.4 || 0.5;
                    return {
                        min: Math.floor((min - padding) * 10) / 10,
                        max: Math.ceil((max + padding) * 10) / 10
                    };
                }

                function createMixedChart(canvasId, values, barColorHex, barRgba) {
                    const bounds = getAxisBounds(values);

                    return new Chart(document.getElementById(canvasId), {
                        type: 'bar',
                        data: {
                            labels: data.months,
                            datasets: [
                                {
                                    type: 'bar',
                                    label: 'Monthly Data',
                                    data: values,
                                    backgroundColor: barRgba,
                                    borderColor: barColorHex,
                                    borderWidth: 0,
                                    borderRadius: 2,
                                    barPercentage: 0.82,
                                    categoryPercentage: 0.92,
                                    order: 2
                                },
                                {
                                    type: 'line',
                                    label: 'Trend',
                                    data: values,
                                    borderColor: '#f1c40f',
                                    backgroundColor: 'transparent',
                                    borderWidth: 2.5,
                                    pointRadius: 2,
                                    pointHoverRadius: 5,
                                    pointBackgroundColor: '#f1c40f',
                                    tension: 0.3,
                                    order: 1
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: {
                                mode: 'index',
                                intersect: false,
                            },
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    backgroundColor: 'rgba(24, 24, 24, 0.95)',
                                    titleFont: { size: 12 },
                                    bodyFont: { size: 13, weight: '600' },
                                    padding: 12,
                                    borderColor: 'rgba(255, 255, 255, 0.15)',
                                    borderWidth: 1,
                                    cornerRadius: 4
                                }
                            },
                            scales: {
                                x: {
                                    grid: { color: 'rgba(255, 255, 255, 0.05)', drawBorder: false },
                                    ticks: { color: '#8b8a87', font: { size: 11 }, maxTicksLimit: 14 }
                                },
                                y: {
                                    min: bounds.min,
                                    max: bounds.max,
                                    grid: { color: 'rgba(255, 255, 255, 0.05)', drawBorder: false },
                                    ticks: { color: '#8b8a87', font: { size: 11 }, padding: 6 }
                                }
                            }
                        }
                    });
                }

                createMixedChart('unemploymentChart', data.unemployment_rate, '#4da6ff', 'rgba(77, 166, 255, 0.75)');
                createMixedChart('participationChart', data.participation_rate, '#2ecc71', 'rgba(46, 204, 113, 0.75)');
                createMixedChart('employmentChart', data.employment_rate, '#f1c40f', 'rgba(241, 196, 15, 0.75)');

            } catch (err) {
                console.error("Failed to load chart data:", err);
                document.getElementById('dashboard').innerHTML = `<div class="loading" style="color: #ff6b6b;">Failed to connect to backend API.</div>`;
            }
        }

        loadDashboardData();
    </script>
</body>
</html>
